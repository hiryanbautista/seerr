# Fork-only: build and push Ryan's image on every push to develop.
name: Docker Image CI

on:
  push:
    branches: [develop]
    paths-ignore: ['**.md', '.github/**']

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          build-args: |
            COMMIT_TAG=${{ github.sha }}
          tags: |
            ryanbautista97/seerr-ios:latest
            ryanbautista97/seerr-ios:v${{ vars.SEERR_MAJOR }}.0.${{ vars.SEERR_MINOR }}

      - name: Bump minor version
        uses: action-pack/increment@1458c307cedd62641619be2480c6263cf39864ac # v2.18
        with:
          name: SEERR_MINOR
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
